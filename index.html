<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Génies en Herbe - Haba Technologie</title>
  
  <!-- Configuration PWA (Application installable & hors ligne) -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Génies en Herbe">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
    
    .app-container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); position: relative; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 0.2rem; }
    header p { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; }

    .btn { display: inline-block; width: 100%; padding: 0.8rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; text-align: center; margin-top: 1rem; text-decoration: none; }
    .btn:hover { background: var(--primary-dark); }
    .btn-install { background: var(--accent); color: #000; font-weight: bold; margin-bottom: 1rem; display: none; }

    .category-badge { display: inline-block; background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; border: 1px solid rgba(96, 165, 250, 0.3); }

    .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 1.5rem 0; text-align: left; }
    .cat-checkbox { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 0.95rem; }
    .cat-checkbox input { width: 18px; height: 18px; accent-color: var(--primary); }

    .input-group { margin-bottom: 1.2rem; }
    .input-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.9rem; }
    .input-group input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-size: 1rem; }

    .options-grid { display: grid; gap: 10px; margin-top: 1.5rem; }
    .option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 1rem; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .option-btn:hover { background: rgba(255,255,255,0.15); }
    .option-btn.correct { background: var(--success) !important; color: white; }
    .option-btn.incorrect { background: var(--danger) !important; color: white; }

    .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

    .hidden { display: none !important; }
    .score-badge { font-size: 2.2rem; font-weight: bold; color: var(--accent); text-align: center; margin: 1rem 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Bouton d'installation PWA -->
    <button id="installBtn" class="btn btn-install">📲 Installer l'application sur mon appareil</button>

    <header>
      <h1>Génies en Herbe</h1>
      <p>PAR HABA TECHNOLOGIE</p>
    </header>

    <!-- Écran de sélection des thèmes -->
    <div id="screen-welcome">
      <p style="text-align: center; margin-bottom: 1rem; color: var(--text-muted);">
        Choisissez les domaines qui vous passionnent pour votre partie :
      </p>

      <div class="categories-grid" id="categories-container">
        <!-- Généré dynamiquement par JS -->
      </div>

      <button class="btn" onclick="app.startQuiz()">Lancer la partie</button>
    </div>

    <!-- Écran d'enregistrement obligatoire après la 1ère partie -->
    <div id="screen-register" class="hidden">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Inscription rapide</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
        Bravo pour votre première partie ! Inscrivez-vous une seule fois pour sauvegarder votre profil.
      </p>
      <form onsubmit="app.handleRegister(event)">
        <div class="input-group">
          <label>Nom complet</label>
          <input type="text" id="reg-name" required placeholder="Ex: Jean Dupont">
        </div>
        <div class="input-group">
          <label>Numéro WhatsApp / Téléphone</label>
          <input type="tel" id="reg-phone" required placeholder="Ex: +243 810 000 000">
        </div>
        <button type="submit" class="btn">Enregistrer et Continuer</button>
      </form>
    </div>

    <!-- Écran du Quiz -->
    <div id="screen-quiz" class="hidden">
      <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <span id="category-tag" class="category-badge">Domaine</span>
        <span id="current-score" style="color: var(--accent); font-weight: bold;">Score: 0</span>
      </div>
      <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;" id="question-count">Question 1/10</div>
      <h2 id="question-text" style="font-size: 1.2rem; min-height: 3.5rem;">Question...</h2>
      <div id="options-container" class="options-grid"></div>
    </div>

    <!-- Écran de résultat -->
    <div id="screen-result" class="hidden" style="text-align: center;">
      <h2>Partie terminée !</h2>
      <div class="score-badge" id="final-score">0 / 10</div>
      <p id="result-message" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
      <button class="btn" onclick="app.showWelcome()">Rejouer / Changer de thèmes</button>
    </div>
  </div>

  <script>
    // --- BANQUE DE QUESTIONS PAR CATEGORIES ---
    const questionsBank = [
      // GÉOGRAPHIE
      { cat: "Géographie", q: "Quelle est la capitale de la République Démocratique du Congo ?", options: ["Lubumbashi", "Kinshasa", "Goma", "Kikwit"], answer: 1 },
      { cat: "Géographie", q: "Quelle est la capitale du Cameroun ?", options: ["Douala", "Garoua", "Yaoundé", "Kribi"], answer: 2 },
      { cat: "Géographie", q: "Quelle est la capitale du Japon ?", options: ["Kyoto", "Osaka", "Tokyo", "Hiroshima"], answer: 2 },
      { cat: "Géographie", q: "Quelle est la capitale du Canada ?", options: ["Toronto", "Montréal", "Vancouver", "Ottawa"], answer: 3 },
      { cat: "Géographie", q: "Quel est le plus grand fleuve d'Afrique par son débit ?", options: ["Le Nil", "Le Fleuve Congo", "Le Niger", "Le Zambèze"], answer: 1 },
      { cat: "Géographie", q: "Quel est le plus grand pays du monde par sa superficie ?", options: ["Chine", "États-Unis", "Russie", "Brésil"], answer: 2 },

      // POLITIQUE
      { cat: "Politique", q: "Qui est le président actuel de la France ?", options: ["Nicolas Sarkozy", "Emmanuel Macron", "François Hollande", "Marine Le Pen"], answer: 1 },
      { cat: "Politique", q: "Qui est le président du Sénégal élu en 2024 ?", options: ["Macky Sall", "Ousmane Sonko", "Bassirou Diomaye Faye", "Abdoulaye Wade"], answer: 2 },
      { cat: "Politique", q: "Dans quel bâtiment réside officiellement le président des États-Unis ?", options: ["Le Pentagone", "La Maison-Blanche", "Le Capitole", "L'Empire State"], answer: 1 },

      // HISTOIRE
      { cat: "Histoire", q: "En quelle année la plupart des pays africains francophones ont-ils obtenu leur indépendance ?", options: ["1950", "1960", "1975", "1980"], answer: 1 },
      { cat: "Histoire", q: "Qui fut le premier Premier ministre de la RDC indépendante ?", options: ["Joseph Kasa-Vubu", "Patrice Lumumba", "Mobutu Sese Seko", "Moïse Tshombe"], answer: 1 },
      { cat: "Histoire", q: "En quelle année s'est terminée la Seconde Guerre mondiale ?", options: ["1918", "1939", "1945", "1950"], answer: 2 },
      { cat: "Histoire", q: "Quel célèbre dirigeant a lutté contre l'Apartheid en Afrique du Sud ?", options: ["Kofi Annan", "Nelson Mandela", "Thomas Sankara", "Kwame Nkrumah"], answer: 1 },

      // SCIENCES
      { cat: "Sciences", q: "Quel est le symbole chimique de l'eau ?", options: ["CO2", "H2O", "O2", "NaCl"], answer: 1 },
      { cat: "Sciences", q: "Quelle planète est la plus proche du Soleil ?", options: ["Vénus", "Terre", "Mars", "Mercure"], answer: 3 },
      { cat: "Sciences", q: "Quel organe est responsable du pompage du sang dans le corps humain ?", options: ["Le Foie", "Le Cerveau", "Le Cœur", "Les Poumons"], answer: 2 },
      { cat: "Sciences", q: "Quel est le gaz le plus abondant dans l'atmosphère terrestre ?", options: ["Oxygène", "Azote", "Dioxyde de carbone", "Hydrogène"], answer: 1 },

      // TECHNOLOGIE
      { cat: "Technologie", q: "Que signifie l'acronyme HTML en développement web ?", options: ["HyperText Markup Language", "High Tech Multi Language", "Hyperlink Text Mode Logic", "Home Tool Markup Language"], answer: 0 },
      { cat: "Technologie", q: "Qui est le fondateur principal de la société Microsoft ?", options: ["Steve Jobs", "Mark Zuckerberg", "Bill Gates", "Elon Musk"], answer: 2 },
      { cat: "Technologie", q: "Quel système d'exploitation mobile est développé par Google ?", options: ["iOS", "Android", "Windows Phone", "Symbian"], answer: 1 },

      // SPORT
      { cat: "Sport", q: "Quel pays a remporté la Coupe du Monde de Football en 2022 ?", options: ["France", "Brésil", "Argentine", "Allemagne"], answer: 2 },
      { cat: "Sport", q: "Combien de joueurs composent une équipe de football sur le terrain ?", options: ["9", "10", "11", "12"], answer: 2 },
      { cat: "Sport", q: "Dans quel sport s'illustre le champion LeBron James ?", options: ["Football", "Tennis", "Basketball", "Athlétisme"], answer: 2 },

      // CULTURE & LITTÉRATURE
      { cat: "Culture", q: "Qui a peint la célèbre œuvre 'La Joconde' (Mona Lisa) ?", options: ["Pablo Picasso", "Léonard de Vinci", "Vincent van Gogh", "Claude Monet"], answer: 1 },
      { cat: "Culture", q: "Quelle est la langue la plus parlée au monde par son nombre de locuteurs natifs ?", options: ["L'Anglais", "L'Espagnol", "Le Mandarin", "L'Arabe"], answer: 2 },
      { cat: "Culture", q: "Qui est l'auteur du roman 'L'Enfant Noir' ?", options: ["Camara Laye", "Chinua Achebe", "Ahmadou Kourouma", "Mariama Bâ"], answer: 0 }
    ];

    class QuizApp {
      constructor() {
        this.currentQuestions = [];
        this.currentIndex = 0;
        this.score = 0;
        this.hasPlayedOnce = localStorage.getItem('haba_played_once') === 'true';
        this.isRegistered = localStorage.getItem('haba_registered') === 'true';

        this.initCategories();
      }

      initCategories() {
        // Extraire la liste unique des catégories disponibles
        const categories = [...new Set(questionsBank.map(q => q.cat))];
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        categories.forEach(cat => {
          const label = document.createElement('label');
          label.className = 'cat-checkbox';
          label.innerHTML = `<input type="checkbox" value="${cat}" checked> ${cat}`;
          container.appendChild(label);
        });
      }

      showScreen(id) {
        ['welcome', 'register', 'quiz', 'result'].forEach(s => {
          document.getElementById(`screen-${s}`).classList.add('hidden');
        });
        document.getElementById(`screen-${id}`).classList.remove('hidden');
      }

      showWelcome() {
        this.showScreen('welcome');
      }

      shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      startQuiz() {
        // Redirection inscription obligatoire après la 1ère partie
        if (this.hasPlayedOnce && !this.isRegistered) {
          this.showScreen('register');
          return;
        }

        // Récupérer les catégories cochées par l'utilisateur
        const checkedBoxes = document.querySelectorAll('#categories-container input[type="checkbox"]:checked');
        const selectedCats = Array.from(checkedBoxes).map(cb => cb.value);

        if (selectedCats.length === 0) {
          alert("Veuillez cocher au moins un domaine pour jouer !");
          return;
        }

        // Filtrer les questions qui correspondent aux choix
        const filteredQuestions = questionsBank.filter(q => selectedCats.includes(q.cat));

        // Mélanger et sélectionner jusqu'à 10 questions
        const shuffled = this.shuffleArray(filteredQuestions);
        this.currentQuestions = shuffled.slice(0, 10);

        this.currentIndex = 0;
        this.score = 0;
        this.showScreen('quiz');
        this.loadQuestion();
      }

      loadQuestion() {
        const q = this.currentQuestions[this.currentIndex];
        document.getElementById('category-tag').textContent = q.cat;
        document.getElementById('question-text').textContent = q.q;
        document.getElementById('question-count').textContent = `Question ${this.currentIndex + 1} / ${this.currentQuestions.length}`;
        document.getElementById('current-score').textContent = `Score: ${this.score}`;
        document.getElementById('progress').style.width = `${((this.currentIndex) / this.currentQuestions.length) * 100}%`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => this.checkAnswer(idx, btn);
          container.appendChild(btn);
        });
      }

      checkAnswer(selectedIndex, buttonEl) {
        const q = this.currentQuestions[this.currentIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        if (selectedIndex === q.answer) {
          buttonEl.classList.add('correct');
          this.score++;
        } else {
          buttonEl.classList.add('incorrect');
          buttons[q.answer].classList.add('correct');
        }

        setTimeout(() => {
          this.currentIndex++;
          if (this.currentIndex < this.currentQuestions.length) {
            this.loadQuestion();
          } else {
            this.endQuiz();
          }
        }, 1200);
      }

      endQuiz() {
        localStorage.setItem('haba_played_once', 'true');
        this.hasPlayedOnce = true;

        document.getElementById('final-score').textContent = `${this.score} / ${this.currentQuestions.length}`;
        
        let msg = "";
        const ratio = this.score / this.currentQuestions.length;
        if (ratio >= 0.8) msg = "🏆 Niveau Génie ! Félicitations pour cette excellente performance !";
        else if (ratio >= 0.5) msg = "👍 Bon travail ! Encore un petit effort pour atteindre la perfection.";
        else msg = "📚 Continue de t'entraîner dans tes thèmes choisis !";
        
        document.getElementById('result-message').textContent = msg;

        if (!this.isRegistered) {
          setTimeout(() => this.showScreen('register'), 1500);
        } else {
          this.showScreen('result');
        }
      }

      handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;

        if (name && phone) {
          localStorage.setItem('haba_registered', 'true');
          localStorage.setItem('haba_user_name', name);
          localStorage.setItem('haba_user_phone', phone);
          this.isRegistered = true;
          this.showScreen('result');
        }
      }
    }

    const app = new QuizApp();

    // --- SUPPORT PWA & HORS LIGNE ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      }
    });

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'genies-haba-v3';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW fail:', err));
    }
  </script>
</body>
</html>
